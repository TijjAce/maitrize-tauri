name: Tests

# Les régressions doivent se voir à la poussée, pas au moment d'une release :
# le workflow Release ne compile qu'à partir d'un tag, donc trop tard.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Dépendances système de Tauri (webkitgtk) : nécessaires pour compiler
      # la bibliothèque, même si les tests eux-mêmes n'ouvrent aucune fenêtre.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Dépendances front
        run: npm install

      - name: Types
        run: npx tsc --noEmit

      - name: Tests front
        run: npm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
