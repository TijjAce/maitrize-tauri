name: Release

# Déclenché en poussant un tag de version, ex. : git tag v1.0.0 && git push origin v1.0.0
# (ou manuellement depuis l'onglet Actions).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la Release et y attacher les binaires

jobs:
  # Rien ne se publie sans que les tests passent. Le workflow « Tests » tourne à
  # chaque poussée sur main, mais un tag peut être posé sur autre chose, ou
  # poussé avant que les tests aient fini : on revérifie ici, et la compilation
  # n'a lieu que si ce garde-fou est vert.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Dépendances front
        run: npm install

      - name: Types
        run: npx tsc --noEmit

      - name: Tests front
        run: npm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # binaire universel (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest # .msi + .exe (NSIS)
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances front
        run: npm install

      # tauri-action v1 : la v0 renommait les fichiers contenant une espace en
      # passant par un dossier temporaire, et cette copie échouait sur les
      # runners macOS (« Error creating asset temp dir ») — trois fois de suite,
      # après une compilation et une notarisation pourtant réussies. La v1 a
      # supprimé ce détour, et `retryAttempts` couvre les envois qui retombent
      # sur une erreur passagère de GitHub.
      - name: Build + signature updater + Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des artefacts de mise à jour (clé minisign Tauri)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature Developer ID + notarisation macOS (hors App Store)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Maitrize V2 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}

  # Le manifeste de mise à jour (latest.json) est écrit pendant que la version
  # est encore un brouillon : tauri-action v1 y met alors des adresses d'API,
  # que la mise à jour automatique des ordinateurs n'est pas assurée de savoir
  # suivre. On les remplace par les liens publics de téléchargement — ceux des
  # versions précédentes, éprouvés — une fois les deux plateformes envoyées.
  manifeste:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Liens publics dans latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\")" > release.json
          test -s release.json
          asset=$(python3 -c "import json; d = json.load(open('release.json')); print([a['id'] for a in d['assets'] if a['name'] == 'latest.json'][0])")
          gh api "repos/$REPO/releases/assets/$asset" -H "Accept: application/octet-stream" > latest.json
          python3 - <<'PY'
          import json, os, re
          d = json.load(open("latest.json"))
          noms = {str(a["id"]): a["name"] for a in json.load(open("release.json"))["assets"]}
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/"
          n = 0
          for v in d.get("platforms", {}).values():
              m = re.search(r"/releases/assets/(\d+)$", v.get("url", ""))
              if m and m.group(1) in noms:
                  v["url"] = base + noms[m.group(1)]
                  n += 1
          json.dump(d, open("latest.json", "w"), ensure_ascii=False)
          print(f"{n} lien(s) réécrit(s) pour {len(d.get('platforms', {}))} plateforme(s)")
          PY
          gh release upload "$TAG" latest.json --clobber -R "$REPO"

  # ─────────────────────────────────────────────────────────────────────────
  # TODO (étape suivante) : signature de code Windows via SignPath.
  # Une fois le projet validé dans le programme open source de SignPath, ajouter
  # un job qui télécharge le .msi/.exe de la Release, le soumet à SignPath
  # (action signpath/github-action-submit-signing-request) et réuploade le binaire
  # signé. Cela supprime l'avertissement SmartScreen en distribution directe.
