name: Essai de la signature Windows

# À lancer à la main (onglet Actions → « Run workflow ») : le même chemin que
# la construction de Maitrize, sans rien construire ni publier. ssign est
# compilé depuis la révision relue, la session de signature s'ouvre sur un
# premier programme d'essai, puis un second est signé comme Tauri le ferait,
# par signer-windows.ps1 et la session seule.
on:
  workflow_dispatch:
    inputs:
      publiee:
        description: "Signer l'application de la dernière version publiée de Maitrize (quelques minutes)"
        type: boolean
        default: false
      maitrize:
        description: "Construire aussi Maitrize pour Windows, signée et vérifiée, sans rien publier (25 min)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  essai:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ssign (cache)
        id: ssign-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssign.exe
          key: ssign-5fd4daf22155b19b645aef3dd467f3c4c9e440b3-${{ runner.os }}

      - name: ssign (compilation de la révision relue, 0.1.7)
        if: steps.ssign-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/Le-Syl21/ssign --rev 5fd4daf22155b19b645aef3dd467f3c4c9e440b3 --locked ssign

      - name: Session de signature (ssign)
        shell: powershell
        run: .github/scripts/ssign-session.ps1
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_UTILISATEUR }}
          CERTUM_OTP: ${{ secrets.CERTUM_TOTP }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ssign-session

      # Le second programme, signé comme Tauri signe Maitrize : la session seule, sans le secret.
      - name: Signer comme le fait Tauri
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'essai-tauri.exe'
          Add-Type -OutputType ConsoleApplication -OutputAssembly $exe -TypeDefinition 'public static class EssaiTauri { public static void Main() { System.Console.WriteLine("Maitrize V2"); } }'
          pwsh -NoProfile -NonInteractive -File .github/scripts/signer-windows.ps1 $exe
          if ($LASTEXITCODE -ne 0) { throw 'La signature a échoué.' }
          $s = Get-AuthenticodeSignature -FilePath $exe
          if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { throw "Signature refusée : $($s.Status) $($s.StatusMessage)" }
          # Sans accents : GitHub écrit ce script sans indicateur d'ordre des octets, que 5.1 lirait de travers.
          Write-Host "Signataire : $($s.SignerCertificate.Subject)"
          Write-Host "Horodatage : $($s.TimeStamperCertificate.Subject)"
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ssign-session

      # L'application elle-même, prise dans l'installeur de la dernière version publiée :
      # un vrai programme de Maitrize, sans attendre vingt minutes de compilation.
      - name: L'application publiée, signée par ssign
        if: inputs.publiee
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ssign-session
        run: |
          $dossier = Join-Path $env:RUNNER_TEMP 'publiee'
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*x64-setup.exe' --dir $dossier
          $setup = Get-ChildItem $dossier -Filter '*x64-setup.exe' | Select-Object -First 1
          7z x $setup.FullName "-o$dossier\contenu" -y | Out-Null
          $app = Get-ChildItem "$dossier\contenu" -Recurse -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $app) { Get-ChildItem "$dossier\contenu" -Recurse | Select-Object -First 40 | ForEach-Object { $_.FullName }; throw "Pas de programme dans l'installeur." }
          Write-Host "Application : $($app.Name), $([math]::Round($app.Length / 1MB, 1)) Mo"
          pwsh -NoProfile -NonInteractive -File .github/scripts/signer-windows.ps1 $app.FullName
          if ($LASTEXITCODE -ne 0) { throw "La signature de l'application a échoué (voir ci-dessus)." }
          $s = Get-AuthenticodeSignature -FilePath $app.FullName
          if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { throw "Signature refusée : $($s.Status) $($s.StatusMessage)" }
          Write-Host "Signataire : $($s.SignerCertificate.Subject)"

      # ── Maitrize entière, comme release.yml la construit — sans rien publier ──
      - name: Node
        if: inputs.maitrize
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust
        if: inputs.maitrize
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances front
        if: inputs.maitrize
        run: npm install

      - name: Signature Windows (réglage de Tauri)
        if: inputs.maitrize
        shell: pwsh
        run: |
          $signer = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/signer-windows.ps1'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $signer, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM src-tauri/tauri.windows.conf.json

      # La session de l'essai a quelques secondes : la compilation de Maitrize en dure quinze minutes.
      # On compile donc d'abord, puis on rouvre la session, comme release.yml.
      - name: Compilation, avant la session de signature
        if: inputs.maitrize
        run: npm run tauri build -- --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Session de signature, rouverte
        if: inputs.maitrize
        shell: powershell
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'ssign-session') -ErrorAction SilentlyContinue
          & .github/scripts/ssign-session.ps1
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_UTILISATEUR }}
          CERTUM_OTP: ${{ secrets.CERTUM_TOTP }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ssign-session

      - name: Assemblage et signature de Maitrize
        if: inputs.maitrize
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ssign-session

      - name: Signature Windows (vérification)
        if: inputs.maitrize
        shell: pwsh
        run: |
          $fichiers = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe) + @(Get-ChildItem src-tauri/target/release/*.exe)
          if (-not $fichiers) { throw 'Aucun fichier Windows à vérifier.' }
          $refuses = 0
          foreach ($f in $fichiers) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($s.Status -eq 'Valid' -and $s.TimeStamperCertificate) {
              Write-Host "✓ $($f.Name) — $($s.SignerCertificate.Subject)"
            } else {
              Write-Host "✗ $($f.Name) — $($s.Status) $($s.StatusMessage)"
              $refuses++
            }
          }
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi | ForEach-Object { Write-Host "· $($_.Name) — sans signature (.msi)" }
          if ($refuses) { throw "$refuses fichier(s) sans signature valide et horodatée." }

      - name: Journal de signature
        if: failure()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'signature-windows.log') -ErrorAction SilentlyContinue

      - name: Session de signature (effacée)
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'ssign-session') -ErrorAction SilentlyContinue
