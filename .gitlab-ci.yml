# La construction sur la Forge des communs numériques éducatifs.
#
# À chaque publication sur main : les essais, et la page d'accueil.
# À chaque étiquette de version (v1.2.3) : en plus, le téléchargement de cette version.
#
# Les machines de la Forge sont sous Linux. Windows s'y construit par compilation croisée ;
# macOS ne peut se construire que sur un Mac : le fichier signé et notarisé vient de la
# version publiée sur GitHub (voir outils/forge/mettre-en-ligne.sh).

stages:
  - essais
  - construction
  - publication

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NODE_VERSION: "22.21.1"
  # L'empreinte publiée par nodejs.org pour cette version : à changer avec elle.
  NODE_SHA256: "680d3f30b24a7ff24b98db5e96f294c0070f8f9078df658da1bce1b9c9873c88"

.machine:
  # Debian 13 : le NSIS de Debian 12 (3.08) n'a pas encore ce que l'installeur de Tauri demande.
  image: rust:1-trixie
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      cmake clang xz-utils
    - curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
    - echo "${NODE_SHA256}  /tmp/node.tar.xz" | sha256sum -c -
    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    - node --version && cargo --version && nproc
    - npm install --no-audit --no-fund

# Le même garde-fou que sur GitHub, sans clippy : ses avertissements changent avec chaque version de Rust.
essais:
  extends: .machine
  stage: essais
  # Une première passe après une mise à jour : tout recompiler, puis enregistrer le cache, a pris 58 minutes.
  timeout: 2h
  cache:
    key: essais-debian13
    paths:
      - .cargo/registry
      - .npm
      - src-tauri/target
  script:
    - npx tsc --noEmit
    # Ces machines sont bien plus lentes qu'un ordinateur de bureau : un seul fil d'essais, plus de temps pour chacun.
    - npm test -- --maxWorkers=1 --testTimeout=60000
    - cargo test --manifest-path src-tauri/Cargo.toml

# L'installeur Windows, compilé depuis Linux avec des outils libres (MinGW, NSIS).
windows:
  extends: .machine
  stage: construction
  # Le maximum des machines de la Forge : partagées, elles peuvent mettre plus d'une heure.
  timeout: 2h
  cache:
    key: windows-debian13
    paths:
      - .cargo/registry
      - .npm
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
    - rustup target add x86_64-pc-windows-gnu
    - node outils/licences/notices.mjs --en-ligne
    - >-
      npx tauri build --target x86_64-pc-windows-gnu --bundles nsis
      --config '{"bundle":{"createUpdaterArtifacts":false}}'
  artifacts:
    expire_in: 30 days
    paths:
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe

# Le téléchargement de la version, pour les collègues : les fichiers signés, déposés sur la Forge.
telechargement:
  stage: publication
  image: alpine:3.22
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash outils/forge/mettre-en-ligne.sh

# La page d'accueil et le mode d'emploi (dossier accueil/). « public » est le nom qu'attend la Forge,
# et, dans ce dépôt, le dossier de Vite : il ne se fabrique qu'ici.
pages:
  stage: publication
  image: alpine:3.22
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - rm -rf public
    - cp -r accueil public
  artifacts:
    paths:
      - public
