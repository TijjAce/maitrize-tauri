# La construction sur la Forge des communs numériques éducatifs.
#
# À chaque publication sur main : les essais, et la page d'accueil.
# À chaque étiquette de version (v1.2.3) : en plus, le téléchargement de cette version.
#
# Les machines de la Forge sont sous Linux. Windows s'y construit par compilation croisée ;
# macOS ne peut se construire que sur un Mac : le fichier signé et notarisé vient de la
# version publiée sur GitHub (voir outils/forge/mettre-en-ligne.sh).

stages:
  - essais
  - construction
  - publication

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NODE_VERSION: "22.21.1"

.machine:
  image: rust:1-bookworm
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      cmake clang xz-utils
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - node --version && cargo --version
    - npm install --no-audit --no-fund
  cache:
    key: machine-linux
    paths:
      - .cargo/registry
      - .npm
      - src-tauri/target

# Le même garde-fou que sur GitHub, sans clippy : ses avertissements changent avec chaque version de Rust.
essais:
  extends: .machine
  stage: essais
  timeout: 1h
  script:
    - npx tsc --noEmit
    - npm test
    - cargo test --manifest-path src-tauri/Cargo.toml

# L'installeur Windows, compilé depuis Linux avec des outils libres (MinGW, NSIS).
windows:
  extends: .machine
  stage: construction
  needs: []
  timeout: 1h
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
    - rustup target add x86_64-pc-windows-gnu
    - node outils/licences/notices.mjs --en-ligne
    - >-
      npx tauri build --target x86_64-pc-windows-gnu --bundles nsis
      --config '{"bundle":{"createUpdaterArtifacts":false}}'
  artifacts:
    expire_in: 30 days
    paths:
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe
