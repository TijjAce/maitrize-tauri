[package]
name = "maitrize-relais"
version = "0.1.0"
description = "Ce que le dictaphone et l'ordinateur se disent par un dossier de Nuage"
license = "AGPL-3.0-or-later"
edition = "2021"

[dependencies]
# Les mêmes versions que l'application de bureau : rien ne se compile deux fois.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Le chiffrement, sur l'ordinateur (et dans les essais) : en Rust. Le dépôt
# part par HTTPS, par rustls, comme partout ailleurs dans l'application.
[target.'cfg(not(target_os = "ios"))'.dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Sur l'iPhone, celui d'Apple : CryptoKit pour sceller et ouvrir, le TLS du
# système pour parler à Nuage. L'application n'embarque aucun algorithme de
# chiffrement à elle, et l'App Store ne demande aucune déclaration.
[target.'cfg(target_os = "ios")'.dependencies]
maitrize-relais-apple = { path = "apple" }
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }
