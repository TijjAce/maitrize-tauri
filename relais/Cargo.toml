[package]
name = "maitrize-relais"
version = "0.1.0"
description = "Ce que le dictaphone et l'ordinateur se disent par un dossier de Nuage"
edition = "2021"

[dependencies]
# Les mêmes versions que l'application de bureau : rien ne se compile deux fois.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
# Le dépôt part par HTTPS : rustls, comme partout ailleurs, pour ne dépendre
# d'aucune bibliothèque du système — l'iPhone n'en fournit pas.
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
