[package]
name = "maitrize-classeur"
version = "0.1.0"
description = "Le classeur de communication de Maitrize"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "maitrize_classeur_lib"
# Comme le compagnon : pas de `cdylib`, Xcode recolle les symboles de l'enveloppe Swift.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Épinglé sur la version de la ligne de commande, comme le compagnon.
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Le format ouvert des tableaux (.obz) : une archive, comme celle que Maitrize écrit (tla_obz.rs).
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
# La compression de l'archive : le moteur écrit en Rust. Sur le Mac, une autre bibliothèque le choisissait ;
# pour l'iPhone, rien ne le faisait, et flate2 refusait de compiler sans moteur.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Il apporte au passage le pont Swift de Tauri (voir le compagnon).
tauri-plugin-dialog = "2.8.3"
# La voix de l'appareil, même en mode silencieux : écrite ici, dans `plugins/`.
tauri-plugin-parole = { path = "plugins/parole" }

# Les pictos d'ARASAAC se cherchent et se prennent depuis Rust : le HTTPS de l'iPhone est celui du système.
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", features = ["native-tls", "json"], default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
