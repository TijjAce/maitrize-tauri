[package]
name = "tauri-plugin-scanner"
version = "0.1.0"
description = "L'appareil des pages d'un manuel, sur l'iPhone : une photo, on ajuste les coins, la page est gardée"
edition = "2021"
# Exigé par tauri-plugin : c'est sous ce nom que Tauri retrouve le dossier iOS.
links = "tauri-plugin-scanner"

[dependencies]
tauri = { version = "=2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
