[package]
name = "tauri-plugin-scanner"
version = "0.1.0"
description = "Le scanner de documents de l'iPhone (VisionKit), pour photographier un manuel page à page"
edition = "2021"
# Exigé par tauri-plugin : c'est sous ce nom que Tauri retrouve le dossier iOS.
links = "tauri-plugin-scanner"

[dependencies]
tauri = { version = "=2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
