[package]
name = "maitrize-dictaphone"
version = "0.1.0"
description = "Le dictaphone de classe de Maitrize"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
# Le suffixe `_lib` évite la collision de noms avec le binaire sur Windows.
name = "maitrize_dictaphone_lib"
# Pas de `cdylib` : sur iPhone, une bibliothèque dynamique doit résoudre ses
# symboles à la compilation, or ceux de l'enveloppe Swift n'existent qu'au
# moment où Xcode assemble l'application. La bibliothèque statique, elle,
# les laisse en suspens — c'est Xcode qui les recolle.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Volontairement court. Ce qui pèse dans l'application de bureau — Whisper,
# le client S3, la génération de PDF — n'a rien à faire sur un téléphone :
# celui-ci enregistre du son et le dépose, rien d'autre.
# Épinglé sur la version du CLI installé : leurs numéros divergent, et garder
# les deux alignés enlève une variable quand la compilation iOS coince.
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Le relais de Nuage : le format et le chiffrement des dépôts, communs au
# dictaphone et à l'application de bureau. Sur l'iPhone, le chiffrement est
# celui d'Apple (CryptoKit) ; ailleurs, du Rust.
maitrize-relais = { path = "../../relais" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tauri-plugin-dialog = "2.7.3"
# Le scanner de documents de l'iPhone : un manuel se photographie page à
# page comme dans Notes, redressé et nettoyé. Écrit ici, dans `plugins/`.
tauri-plugin-scanner = { path = "plugins/scanner" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2.190"

# Le trousseau de l'iPhone : le mot de passe d'application que Nuage remet au
# téléphone y est gardé, chiffré par le système, lisible par cette seule
# application, et jamais copié dans une sauvegarde.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"

# L'envoi part de Rust et non de la page : les règles réseau d'iOS
# (App Transport Security) ne s'appliquent pas aux sockets, ce qui évite
# d'avoir à déclarer une exception pour parler en clair au Mac du WiFi.
# Le HTTPS de l'iPhone est celui du système, comme son chiffrement (voir
# relais/Cargo.toml) ; rustls ne sert qu'aux essais, sur l'ordinateur.
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
