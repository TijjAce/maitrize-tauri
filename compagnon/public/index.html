<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictaphone — Maitrize</title>
<style>
 :root { --bg:#f6f7fb; --card:#fff; --txt:#1c2233; --txt2:#687087; --acc:#6366f1; --bd:#e3e6ef; --rouge:#dc2626; }
 @media (prefers-color-scheme: dark) {
   :root { --bg:#12141c; --card:#1b1e28; --txt:#eceff7; --txt2:#9aa2b8; --bd:#2a2f3d; }
 }
 * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
 body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
   background:var(--bg); color:var(--txt); }
 header { padding:calc(14px + env(safe-area-inset-top)) 16px 12px; font-weight:700; font-size:17px; }
 main { padding:0 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
 .card { background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:18px 16px; margin-bottom:12px; }
 .gros { width:100%; padding:30px 16px; font-size:21px; font-weight:700; border:none; border-radius:18px;
   background:var(--acc); color:#fff; font-family:inherit; }
 .gros.rouge { background:var(--rouge); }
 .gros:disabled { opacity:.45; }
 .chrono { font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; margin:0 0 2px; }
 .meta { color:var(--txt2); font-size:13.5px; line-height:1.55; }
 .titre { font-size:12px; font-weight:700; color:var(--txt2); text-transform:uppercase;
   letter-spacing:.05em; margin:18px 0 8px; }
 .ligne { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--bd);
   border-radius:12px; padding:11px 13px; margin-bottom:7px; font-size:14px; }
 .ligne b { font-variant-numeric:tabular-nums; }
 .pt { width:9px; height:9px; border-radius:50%; flex:none; }
 .btn { border:1px solid var(--bd); background:var(--card); color:var(--txt); border-radius:10px;
   padding:10px 14px; font-size:14px; font-family:inherit; }
 .btn.plein { background:var(--acc); color:#fff; border-color:transparent; font-weight:600; }
 input { width:100%; padding:12px; border:1px solid var(--bd); border-radius:10px; font-size:15px;
   background:var(--bg); color:var(--txt); font-family:inherit; }
 .err { color:var(--rouge); font-size:13.5px; }
</style>
</head>
<body>
<header>🎙 Dictaphone</header>
<main id="ecran"></main>
<script type="module" src="./dictaphone.js"></script>
</body>
</html>
