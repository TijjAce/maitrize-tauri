<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Maitrize</title>
<!--
  L'entrée de l'application : « au lancement du compagnon pour la première fois,
  choisir si on est en mode élève ou en mode enseignant » (l'enseignant, 6 novembre
  2026). Le choix fait, cette page ne fait que mener à la bonne.
-->
<style>
 :root { --bg:#f2f2f7; --card:#fff; --txt:#111827; --txt2:#6b7280; --acc:#4f46e5; }
 @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --txt:#f5f5f7; --txt2:#98989f; --acc:#818cf8; } }
 html, body { height:100%; margin:0; background:var(--bg); color:var(--txt); font:17px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
 main { box-sizing:border-box; min-height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; gap:14px;
   padding:max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
 main[hidden] { display:none; }
 h1 { margin:0 0 14px; font-size:27px; font-weight:700; text-align:center; }
 button { display:flex; align-items:center; gap:16px; width:100%; min-height:96px; padding:16px 20px; border:0; border-radius:18px; background:var(--card); color:inherit;
   font:inherit; text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; box-shadow:0 1px 3px rgba(0,0,0,.08); }
 button:active { opacity:.7; }
 svg { flex:none; width:44px; height:44px; fill:none; stroke:var(--acc); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
 b { display:block; font-size:21px; font-weight:650; }
 small { display:block; margin-top:2px; color:var(--txt2); font-size:15px; }
</style>
</head>
<body>
<main id="choix" hidden>
  <h1>Qui utilise cet appareil ?</h1>
  <button data-mode="enseignant">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 20.5c.6-4.2 3.6-6.6 7.5-6.6s6.9 2.4 7.5 6.6"/></svg>
    <span><b>Enseignant</b><small>Cahier journal, dictées, tablettes</small></span>
  </button>
  <button data-mode="eleve">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
    <span><b>Élève</b><small>Classeur de communication</small></span>
  </button>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const PAGES = { enseignant: "enseignant.html", eleve: "classeur/index.html" };
  (async () => {
    let mode = "";
    try { mode = (await invoke("mode_lire")).mode; } catch (e) { /* on le redemande */ }
    if (!mode) {
      // Un téléphone déjà relié à Nuage, d'avant ce choix : c'est celui de l'enseignant, on ne lui demande rien.
      try {
        if ((await invoke("relais_lire")).relie) {
          await invoke("mode_choisir", { mode: "enseignant" });
          mode = "enseignant";
        }
      } catch (e) { /* on le lui demande */ }
    }
    if (mode) { location.replace(PAGES[mode]); return; }
    document.getElementById("choix").hidden = false;
    document.querySelectorAll("[data-mode]").forEach((b) => {
      b.onclick = async () => {
        await invoke("mode_choisir", { mode: b.dataset.mode });
        location.replace(PAGES[b.dataset.mode]);
      };
    });
  })();
</script>
</body>
</html>
