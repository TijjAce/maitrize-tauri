<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictaphone — Maitrize</title>
<style>
 :root { --bg:#f6f7fb; --card:#fff; --txt:#1c2233; --txt2:#687087; --acc:#6366f1; --bd:#e3e6ef; --rouge:#dc2626; }
 @media (prefers-color-scheme: dark) {
   :root { --bg:#12141c; --card:#1b1e28; --txt:#eceff7; --txt2:#9aa2b8; --bd:#2a2f3d; }
 }
 * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
 body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
   background:var(--bg); color:var(--txt); }
 header { padding:calc(14px + env(safe-area-inset-top)) 16px 12px; font-weight:700; font-size:17px; }
 main { padding:0 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
 .card { background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:18px 16px; margin-bottom:12px; }
 .gros { width:100%; padding:30px 16px; font-size:21px; font-weight:700; border:none; border-radius:18px;
   background:var(--acc); color:#fff; font-family:inherit; }
 .gros.rouge { background:var(--rouge); }
 .gros:disabled { opacity:.45; }
 .chrono { font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; margin:0 0 2px; }
 .meta { color:var(--txt2); font-size:13.5px; line-height:1.55; }
 .titre { font-size:12px; font-weight:700; color:var(--txt2); text-transform:uppercase;
   letter-spacing:.05em; margin:18px 0 8px; }
 .ligne { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--bd);
   border-radius:12px; padding:11px 13px; margin-bottom:7px; font-size:14px; }
 .ligne b { font-variant-numeric:tabular-nums; }
 .pt { width:9px; height:9px; border-radius:50%; flex:none; }
 .btn { border:1px solid var(--bd); background:var(--card); color:var(--txt); border-radius:10px;
   padding:10px 14px; font-size:14px; font-family:inherit; }
 .btn.plein { background:var(--acc); color:#fff; border-color:transparent; font-weight:600; }
 input { width:100%; padding:12px; border:1px solid var(--bd); border-radius:10px; font-size:15px;
   background:var(--bg); color:var(--txt); font-family:inherit; }
 .err { color:var(--rouge); font-size:13.5px; }
 /* Un avertissement sur la dictée qui vient de finir : à lire, pas à craindre. */
 .avis { font-size:13.5px; line-height:1.5; background:var(--card); border:1px solid var(--bd);
   border-left:3px solid var(--acc); border-radius:10px; padding:11px 13px; margin:0 0 10px; }
 /* La jauge dit que le micro entend quelque chose. Sans elle, on ne sait
    qu'au retour, devant une transcription vide, que rien n'avait été capté. */
 .jauge-fond { height:8px; border-radius:99px; background:var(--bd); overflow:hidden; margin:2px 0 0; }
 .jauge { height:100%; width:0; border-radius:99px; background:var(--acc);
   transition:width .1s linear; }
 .ligne .btn { padding:8px 11px; }
 textarea { width:100%; margin-top:10px; padding:12px; border:1px solid var(--bd); border-radius:10px;
   font-size:16px; background:var(--bg); color:var(--txt); font-family:inherit; resize:none; }
 /* Sous quoi l'on enregistre : la seule chose que ce téléphone sait de la
    classe, et il faut qu'elle se lise d'un coup d'œil. */
 .creneau { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
   background:var(--bg); border:1px solid var(--bd); border-radius:12px; padding:10px 13px;
   font-size:14.5px; font-weight:600; color:var(--txt); font-family:inherit; margin-bottom:14px; }
 .creneau.vide { font-weight:400; color:var(--txt2); font-size:13.5px; display:block; text-align:left; }
 .creneau-action { color:var(--acc); font-weight:600; font-size:13.5px; flex:none; }
 .choix { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
 .choix-ligne { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
   background:var(--bg); border:1px solid var(--bd); border-radius:12px; padding:12px 13px;
   font-size:15px; color:var(--txt); font-family:inherit; }
 .choix-ligne.on { border-color:var(--acc); background:var(--card); }
 .choix-ligne b { font-variant-numeric:tabular-nums; min-width:44px; flex:none; }
 .creneau-puce { flex:none; opacity:.8; }
 .vue { width:100%; border-radius:12px; background:#000; display:block; aspect-ratio:1/1;
   object-fit:cover; }
 .note-apercu { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; font-size:13.5px; }
</style>
</head>
<body>
<header>🎙 Dictaphone</header>
<main id="ecran"></main>
<!-- jsQR (MIT) : le décodage du QR code, en local. Rien n'est téléchargé
     au moment de scanner — l'application doit marcher sans réseau. -->
<script src="./jsQR.js"></script>
<script type="module" src="./dictaphone.js"></script>
</body>
</html>
