<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dictaphone — Maitrize</title>
<style>
 :root {
   --bg:#f2f2f7; --card:#fff; --txt:#111827; --txt2:#6b7280; --txt3:#9ca3af;
   --acc:#6366f1; --acc-fonce:#4f46e5; --acc-txt:#4f46e5; --acc-doux:rgba(99,102,241,.12);
   --sep:rgba(17,24,39,.08); --champ:#f2f2f7;
   --rouge:#e5484d; --rouge-doux:rgba(229,72,77,.12);
   --vert:#16a34a; --orange:#d97706; --orange-doux:rgba(217,119,6,.13);
   --ombre:0 1px 2px rgba(17,24,39,.05), 0 6px 20px rgba(17,24,39,.06);
 }
 @media (prefers-color-scheme: dark) {
   :root {
     --bg:#0b0c10; --card:#17191f; --txt:#f3f4f6; --txt2:#9ca3af; --txt3:#6b7280;
     --acc-txt:#a5b4fc; --acc-doux:rgba(129,140,248,.16);
     --sep:rgba(255,255,255,.08); --champ:#0f1116;
     --rouge-doux:rgba(229,72,77,.18); --orange-doux:rgba(217,119,6,.2);
     --ombre:none;
   }
 }
 * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
 [hidden] { display:none !important; }
 /* Pas de zoom, ni au pincement ni au double appui : l'écran est fait pour le pouce. */
 html { -webkit-text-size-adjust:100%; touch-action:manipulation; overflow-x:hidden; }
 body { touch-action:manipulation; overflow-x:hidden; }
 body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
   background:var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased; }
 button { font-family:inherit; cursor:pointer; }
 button:disabled { opacity:.45; cursor:default; }
 .ic { width:20px; height:20px; flex:none; display:block; }
 .ic.petit { width:16px; height:16px; }

 /* L'en-tête : le nom, et par où partirait une dictée maintenant. */
 header { display:flex; align-items:center; justify-content:space-between; gap:12px;
   padding:calc(12px + env(safe-area-inset-top)) 20px 4px; max-width:520px; margin:0 auto; }
 h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em; }
 .liaison { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px;
   background:var(--card); box-shadow:var(--ombre); font-size:13.5px; font-weight:600; color:var(--txt2); }
 .pt { width:8px; height:8px; border-radius:50%; flex:none; background:var(--txt3); display:inline-block; }
 .ok .pt, .pt.ok { background:var(--vert); }
 .loin .pt, .pt.loin { background:var(--orange); }

 main { padding:0 16px calc(32px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }

 /* Deux parties : ce qui passe par Nuage, ce qui passe par le WiFi. L'en-tête de chacune le dit. */
 h2.partie { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:26px 4px 2px; font-size:19px; font-weight:800;
   letter-spacing:-.01em; }
 h2.partie:first-child { margin-top:14px; }
 h2.partie .ic { width:22px; height:22px; color:var(--acc-txt); }
 h2.partie small { flex-basis:100%; margin-left:30px; font-size:13px; font-weight:500; color:var(--txt2); letter-spacing:0; }

 /* Dicter : le geste de la journée, au milieu de l'écran. */
 .heros { display:flex; flex-direction:column; align-items:center; padding:12px 0 4px; }
 /* Le jour dont on parle : aujourd'hui, ou un autre — qui se voit de loin. */
 .jour { display:flex; align-items:center; gap:8px; width:100%; padding:6px; margin-bottom:14px;
   border-radius:16px; background:var(--card); box-shadow:var(--ombre); }
 .jour.autre { background:var(--orange-doux); box-shadow:none; }
 .jour-fleche { width:42px; height:42px; border-radius:12px; border:none; display:grid; place-items:center; flex:none;
   background:var(--champ); color:var(--txt); }
 .jour.autre .jour-fleche { background:var(--card); }
 .jour-texte { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px;
   border:none; background:none; color:var(--txt); padding:0; font-family:inherit; }
 .jour-texte b { font-size:16.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
 .jour-texte span { font-size:13px; color:var(--txt2); }
 .jour.autre .jour-texte span { color:var(--orange); font-weight:600; }
 .pastille { display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:10px 15px;
   border:none; border-radius:99px; background:var(--card); box-shadow:var(--ombre); color:var(--txt);
   font-size:15px; font-weight:600; margin:0; }
 .pastille > .ic:first-child { color:var(--acc-txt); }
 .pastille span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .pastille .petit { color:var(--txt3); }
 .pastille.muette { color:var(--txt2); font-weight:500; box-shadow:none; background:transparent; }
 .pastille.muette > .ic:first-child { color:var(--txt3); }
 .rond-cadre { position:relative; width:164px; height:164px; margin:30px 0 12px; }
 .rond { position:relative; width:164px; height:164px; border-radius:50%; border:none; display:grid;
   place-items:center; color:#fff; background:linear-gradient(150deg, #818cf8 0%, var(--acc) 45%, var(--acc-fonce) 100%);
   box-shadow:0 14px 34px rgba(79,70,229,.38), inset 0 1px 0 rgba(255,255,255,.28);
   transition:transform .12s ease; }
 .heros > .rond { margin:30px 0 12px; }
 .rond:active { transform:scale(.96); }
 .rond .ic { width:62px; height:62px; stroke-width:1.8; }
 .rond.rouge { background:linear-gradient(150deg, #f87171 0%, var(--rouge) 50%, #c2272d 100%);
   box-shadow:0 14px 34px rgba(220,38,38,.35), inset 0 1px 0 rgba(255,255,255,.25); }
 .rond.rouge .ic { width:52px; height:52px; }
 /* Le halo suit la voix : on voit d'un coup d'œil que le micro entend. */
 .halo { position:absolute; inset:0; border-radius:50%; background:var(--rouge-doux);
   transition:transform .1s linear; }
 .rond-legende { margin:0; font-size:17px; font-weight:700; }
 .chrono { margin:22px 0 0; font-size:58px; font-weight:700; letter-spacing:-.02em;
   font-variant-numeric:tabular-nums; line-height:1; }
 .muet { margin:14px 0 0; color:var(--rouge); font-size:14.5px; font-weight:600; }
 .tuiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:26px; }
 .tuile.seule { width:100%; margin-top:24px; }
 .tuile { display:flex; align-items:center; justify-content:center; gap:9px; padding:15px 12px;
   border:none; border-radius:16px; background:var(--card); box-shadow:var(--ombre); color:var(--txt);
   font-size:15.5px; font-weight:600; }
 .tuile .ic { color:var(--acc-txt); }

 /* Écrire plutôt que parler. */
 .note-carte { width:100%; margin-top:20px; }
 textarea { width:100%; min-height:150px; padding:14px; border:none; border-radius:16px; background:var(--card);
   box-shadow:var(--ombre); color:var(--txt); font-family:inherit; font-size:16.5px; line-height:1.45; resize:none;
   outline:none; display:block; }
 .deux { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }

 .btn-plein, .btn-doux { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
   padding:15px 14px; border:none; border-radius:14px; font-size:16px; font-weight:700; }
 .btn-plein { background:var(--acc); color:#fff; }
 .btn-doux { background:var(--card); color:var(--txt); box-shadow:var(--ombre); }
 .groupe + .btn-plein, .groupe + .groupe, .btn-plein + .groupe { margin-top:12px; }
 .carte .btn-doux { background:var(--champ); box-shadow:none; }
 .carte .btn-plein + .btn-doux, .carte .vue + .btn-doux, .carte .erreur-ligne + .btn-doux { margin-top:10px; }
 label.btn-plein { cursor:pointer; }
 .btn-plein.inactif { opacity:.45; pointer-events:none; }
 .carte-wifi { margin-top:10px; padding:16px; }
 .carte-info { display:flex; align-items:center; gap:8px; margin:12px 2px 0; font-size:14.5px; color:var(--txt2); }
 .carte-info .ic { width:18px; height:18px; color:var(--vert); }
 .lien-btn { border:none; background:none; color:var(--acc-txt); font-size:15px; font-weight:600;
   padding:8px 2px; flex:none; }
 .lien-btn.rouge { color:var(--rouge); }
 /* Les pages du manuel gardées sur le téléphone, au pied de la carte du WiFi. */
 .pages-gardees { margin:14px 2px 0; padding-top:12px; border-top:1px solid var(--sep); }
 .pages-gardees p { display:flex; align-items:center; gap:8px; margin:0; font-size:14.5px; color:var(--txt2); }
 .pages-gardees p .ic { width:18px; height:18px; flex:none; color:var(--acc-txt); }
 .pages-gardees.confirmer p { color:var(--txt); font-weight:600; }
 .pages-gardees .pages-aide { margin-top:6px; font-size:13.5px; color:var(--txt3); }
 .pages-boutons { display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:8px; }
 .pages-boutons:empty { display:none; }

 /* Ce qui vient de se passer : à lire en passant. */
 .bulle { display:flex; gap:10px; align-items:flex-start; margin:16px 0 0; padding:12px 14px; border-radius:14px;
   background:var(--acc-doux); font-size:14.5px; line-height:1.45; }
 .bulle .ic { width:18px; height:18px; margin-top:1px; color:var(--acc-txt); }
 .bulle.alerte { background:var(--orange-doux); }
 .bulle.alerte .ic { color:var(--orange); }
 .bulle.erreur { background:var(--rouge-doux); }
 .bulle.erreur .ic { color:var(--rouge); }

 .titre { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:28px 4px 8px;
   font-size:13px; font-weight:600; color:var(--txt2); text-transform:uppercase; letter-spacing:.06em; }

 /* Les listes, à la façon des réglages de l'iPhone. */
 .groupe { background:var(--card); border-radius:16px; box-shadow:var(--ombre); overflow:hidden; }
 .rang { position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:58px;
   padding:10px 12px 10px 14px; border:none; background:transparent; color:var(--txt); text-align:left; font-size:15px; }
 .rang + .rang::before { content:""; position:absolute; top:0; left:62px; right:0; height:1px; background:var(--sep); }
 .ico { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none;
   background:var(--acc-doux); color:var(--acc-txt); }
 .ico .ic { width:18px; height:18px; }
 .rang-texte { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
 .rang-titre { font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .rang-titre.accent { color:var(--acc-txt); }
 .rang-sous { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--txt2); min-width:0; }
 .coupe { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
 .icone-btn { width:40px; height:40px; border-radius:50%; border:none; display:grid; place-items:center; flex:none;
   background:var(--champ); color:var(--txt); }
 .icone-btn .ic { width:17px; height:17px; }
 .icone-btn.danger { color:var(--rouge); }
 .vide-ok { color:var(--txt2); font-weight:500; }
 .vide-ok .ic { color:var(--vert); }

 /* Le choix du créneau, à la place de la pastille. */
 .choix { width:100%; }
 .choix-rang { display:flex; align-items:center; gap:14px; width:100%; min-height:52px; padding:12px 16px;
   border:none; background:transparent; color:var(--txt); font-size:15.5px; text-align:left; position:relative; }
 .choix-rang + .choix-rang::before { content:""; position:absolute; top:0; left:16px; right:0; height:1px; background:var(--sep); }
 .choix-rang b { font-variant-numeric:tabular-nums; min-width:52px; color:var(--txt2); font-weight:600; }
 .choix-rang span { flex:1; }
 .choix-rang.on { color:var(--acc-txt); font-weight:700; }
 .choix-rang .ic { color:var(--acc-txt); }

 /* Relier : le QR code d'abord, un code collé sinon. */
 .carte { background:var(--card); border-radius:20px; box-shadow:var(--ombre); padding:24px 18px 18px; margin-top:12px; }
 .partie + .carte { margin-top:12px; }
 .carte-tete { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:20px; }
 .grand-ico { width:58px; height:58px; border-radius:18px; display:grid; place-items:center;
   background:var(--acc-doux); color:var(--acc-txt); }
 .grand-ico .ic { width:28px; height:28px; }
 .carte-tete h3 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; }
 .carte-tete .sous { margin:-6px 0 0; font-size:15px; color:var(--txt2); text-align:center; overflow-wrap:anywhere; }
 .carte-tete .sous b { color:var(--txt); font-weight:600; }
 .vue { width:100%; aspect-ratio:1/1; border-radius:16px; object-fit:cover; background:#000; display:block; margin-bottom:10px; }
 .ou { display:flex; align-items:center; gap:12px; margin:18px 0 14px; color:var(--txt3); font-size:13.5px; }
 .ou::before, .ou::after { content:""; flex:1; height:1px; background:var(--sep); }
 input { width:100%; padding:14px; border:1px solid var(--sep); border-radius:12px; background:var(--champ);
   color:var(--txt); font-family:inherit; font-size:16px; outline:none; }
 input:focus { border-color:var(--acc); }
 .erreur-ligne { margin:10px 0 0; color:var(--rouge); font-size:14px; }
 .centre { display:block; margin:12px auto 0; }
</style>
</head>
<body>
<header><h1>Dictaphone</h1><span id="liaison" class="liaison" hidden></span></header>
<main id="ecran"></main>
<!-- jsQR (MIT) : le décodage du QR code, en local. Rien n'est téléchargé
     au moment de scanner — l'application doit marcher sans réseau. -->
<script src="./jsQR.js"></script>
<script type="module" src="./dictaphone.js"></script>
</body>
</html>
